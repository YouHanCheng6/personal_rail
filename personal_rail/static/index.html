<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>沿线 · 交通查询</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand">沿线 <span>交通查询</span></a
      ><span>本地查询 · 不调用模型</span>
    </header>
    <main>
      <section class="hero">
        <h1>去哪里，先把班次查清楚。</h1>
        <p>火车、飞机、汽车，分别查看时刻、价格与来源。</p>
      </section>
      <section class="panel">
        <form id="search-form">
          <div class="form-grid">
            <div>
              <label for="origin">从哪里出发</label>
              <div class="place-field">
                <input
                  id="origin"
                  value="北京"
                  required
                  maxlength="100"
                /><button type="button" data-place="origin">查地点</button>
              </div>
              <div id="origin-options"></div>
            </div>
            <div>
              <label for="destination">到哪里去</label>
              <div class="place-field">
                <input
                  id="destination"
                  value="龙川"
                  required
                  maxlength="100"
                /><button type="button" data-place="destination">查地点</button>
              </div>
              <div id="destination-options"></div>
            </div>
            <div>
              <label for="date">出发日期</label
              ><input id="date" type="date" required />
            </div>
            <div>
              <label for="radius">无机场地区：周边机场范围</label
              ><select id="radius">
                <option value="150">150公里</option>
                <option value="250" selected>250公里</option>
                <option value="400">400公里</option>
                <option value="600">600公里</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <fieldset>
              <legend>查询交通</legend>
              <label
                ><input
                  type="checkbox"
                  name="mode"
                  value="rail"
                  checked
                />火车</label
              ><label
                ><input
                  type="checkbox"
                  name="mode"
                  value="flight"
                  checked
                />飞机</label
              ><label
                ><input
                  type="checkbox"
                  name="mode"
                  value="coach"
                  checked
                />汽车</label
              >
            </fieldset>
            <button id="submit" class="primary">查询班次</button
            ><button type="button" id="cancel" hidden>取消查询</button>
          </div>
        </form>
        <p class="hint">
          具体地点用于确定所在城市和附近机场。火车含平台现成换乘，不生成跨交通方式行程；机场范围按直线距离，非驾车里程。
        </p>
        <div id="quick" class="quick"></div>
      </section>
      <p id="status" role="status">选择日期后开始查询。</p>
      <section class="panel results">
        <div class="section-head">
          <h2>查询结果</h2>
          <button id="export" disabled>导出已查资料</button>
        </div>
        <nav id="tabs" aria-label="交通类别">
          <button data-mode="rail" aria-pressed="true">火车 · 0</button
          ><button data-mode="flight" aria-pressed="false">飞机 · 0</button
          ><button data-mode="coach" aria-pressed="false">汽车 · 0</button>
        </nav>
        <div id="scope"></div>
        <div class="filters">
          <label
            >筛选车次、航班或车站<input
              id="filter"
              placeholder="输入名称或编号" /></label
          ><label
            >排列顺序<select id="sort">
              <option value="departure">出发时间</option>
              <option value="price">席别最低价合计排序</option>
              <option value="destination">到达站 / 机场</option>
            </select></label
          >
        </div>
        <p id="count" class="hint"></p>
        <div id="rows">
          <p class="empty">尚未查询。结果按交通方式列出，不做精选截断。</p>
        </div>
        <div class="pagination">
          <button id="prev" disabled>上一页</button><span id="page">0 / 0</span
          ><button id="next" disabled>下一页</button>
        </div>
        <details>
          <summary>来源与查询状态</summary>
          <div id="sources"></div>
        </details>
      </section>
      <section class="panel">
        <div class="section-head">
          <h2>官方公告</h2>
          <select id="news-category" aria-label="公告类别">
            <option value="rail">铁路</option>
            <option value="flight">航空</option>
            <option value="coach">公路客运</option></select
          ><button id="news-load">读取公告</button>
        </div>
        <div id="news"></div>
      </section>
      <footer>
        只展示已接入公开来源能够取得的资料，不代表全网班次或已核验余票。日期、价格缺失会单独标注。
      </footer>
    </main>
  </body>
</html>
